<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strike Her Heart · 原页面标注演示</title>
  <style>
    :root{color-scheme:light;--ink:#1b2939;--muted:#69778a;--line:#e2e8ee;--brand:#315d58;--paper:#fff;--bg:#f4f7f8}
    *{box-sizing:border-box}body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}a{color:var(--brand)}
    .demo-notice{background:#e9f4ef;color:#2b5e4e;padding:10px 28px;font-size:12px;letter-spacing:.02em;border-bottom:1px solid #d0e4d9}.demo-notice strong{margin-right:12px}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px}.brand{font-size:20px;font-weight:700;letter-spacing:-.8px;display:flex;align-items:center;gap:10px}.brand-mark{width:32px;height:32px;border-radius:10px;background:#315d58;display:grid;place-items:center;color:#fff;font-size:19px}.workspace{color:var(--muted);font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;background:#e8eeec;display:grid;place-items:center;color:var(--brand);font-weight:600}.top-right{display:flex;gap:12px;align-items:center}
    .layout{display:grid;grid-template-columns:195px minmax(0,1fr);min-height:calc(100vh - 118px)}.nav{padding:26px 16px;border-right:1px solid var(--line);background:#fff}.nav-label{text-transform:uppercase;color:#929daa;font-size:10px;font-weight:600;letter-spacing:1.5px;padding:0 13px;margin-bottom:12px}.nav a{display:block;text-decoration:none;color:#657284;border-radius:8px;padding:12px 13px;margin-bottom:7px}.nav a[aria-current="page"]{background:#eaf2f0;color:#254f49;font-weight:600}.nav-footer{margin:44px 12px;color:#8a95a3;font-size:11px}.main{padding:30px 34px 54px;max-width:1500px}.eyebrow{font-size:11px;color:var(--brand);font-weight:700;letter-spacing:1.6px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:6px 0 25px}.pagehead h1{font-size:29px;font-weight:650;margin:0 0 6px;letter-spacing:-.6px}.sub{color:var(--muted);margin:0;font-size:13px}.actions{display:flex;gap:10px;align-items:center}.button{border:1px solid #d8e1e4;background:#fff;border-radius:7px;padding:9px 14px;color:#38505b;white-space:nowrap}.button.primary{background:#315d58;color:#fff;border-color:#315d58}.button:hover{filter:brightness(.97)}.button:disabled{opacity:.45;cursor:not-allowed}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:23px}.stat{border:1px solid var(--line);border-radius:10px;padding:17px 19px;background:#fff}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:27px;line-height:1.5;font-weight:620;letter-spacing:-1px}.stat-foot{font-size:11px;color:#6e8b7b}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:20px;box-shadow:0 3px 10px #1b293903}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:15px;margin:0}.filters{display:flex;gap:13px;padding:18px 20px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;min-width:125px}.field.grow{flex:1}.field label,.field-label{font-size:12px;color:#607082}.input{border:1px solid #dbe2e7;border-radius:6px;padding:9px 11px;background:#fff;color:var(--ink);width:100%;min-height:40px}.field small{font-size:11px;color:#8b96a3}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap;font-size:12px}th{font-weight:500;color:#8994a2;background:#f8fafb;padding:12px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:16px 18px;border-bottom:1px solid #edf1f4}tr:last-child td{border-bottom:0}.name{font-weight:600;color:#2c4055}.mini{font-size:11px;color:#98a2ad}.status{padding:4px 8px;border-radius:5px;font-size:10px;color:#447366;background:#eef6f1}.status.amber{color:#977130;background:#fcf6e9}.status.gray{color:#6d7e8b;background:#eff3f6}.text-button{border:0;background:none;color:#315d58;padding:4px 0;font-size:12px}.table-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;color:#8794a2;font-size:11px}.helper{padding:13px 18px;color:#66798a;background:#edf3f6;border:1px solid #dce7ee;border-radius:8px;font-size:12px}.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:19px;padding:22px}.span-two{grid-column:1/-1}textarea{resize:vertical;min-height:98px}.check{display:flex;gap:9px;align-items:center;font-size:12px;color:#627487}.check input{accent-color:var(--brand)}.settings-footer{padding:18px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}.project-card{padding:22px}.project-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:600}.project-meta{color:var(--muted);font-size:12px;margin:10px 0 20px}.progress-track{height:5px;border-radius:8px;background:#e8efed;margin:15px 0}.progress-fill{width:68%;height:100%;background:#669a83;border-radius:8px}.project-bottom{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.empty{padding:32px;color:var(--muted);text-align:center}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#254f49;color:#fff;border-radius:8px;z-index:9000;font-size:13px;box-shadow:0 8px 24px #15302a22}.toast[hidden]{display:none}
    dialog{border:1px solid #dae3e6;border-radius:14px;width:480px;max-width:calc(100vw - 40px);padding:0;color:var(--ink);box-shadow:0 25px 90px #152b3633}dialog::backdrop{background:#1b29394d}dialog h2{font-size:20px;margin:0}dialog .dialog-head{padding:23px 24px 12px;display:flex;justify-content:space-between;align-items:center}dialog .dialog-body{padding:12px 24px 24px;display:grid;gap:18px}.close{border:0;background:#f0f4f5;width:28px;height:28px;border-radius:50%;font-size:19px;color:#607080}.dialog-foot{border-top:1px solid var(--line);padding:16px 24px;display:flex;gap:10px;justify-content:flex-end}.required{color:#b5715c}.tabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:14px 0;color:#8a96a3}.tabs button[aria-selected=true]{border-bottom-color:var(--brand);color:var(--brand);font-weight:600}.help-link{font-size:12px}.project-select{margin-bottom:20px;display:flex;gap:13px;align-items:center;color:var(--muted);font-size:12px}.project-select select{width:150px}.tabcontent[hidden]{display:none}.note{font-size:11px;color:#8c98a4;margin:12px 0 0}.outline{border:1px dashed #b5c6be;border-radius:8px;padding:18px;margin-top:19px;font-size:12px;color:#688075}
    @media(min-width:1100px){body{padding-right:418px}.main{padding:26px 24px}.pagehead{align-items:flex-start}.pagehead .actions{gap:7px}.pagehead .button{padding:8px 10px}.workspace{display:none}}@media(max-width:920px){.main{padding:24px 20px}.layout{grid-template-columns:155px minmax(0,1fr)}.pagehead{align-items:flex-start}.stats{gap:8px}.stat{padding:13px}.grid-two{grid-template-columns:1fr}.topbar{padding:0 20px}.workspace{display:none}}@media(max-width:650px){.layout{display:block}.nav{display:flex;gap:8px;padding:10px;border-right:0;overflow:auto}.nav a{margin:0;white-space:nowrap;padding:8px}.nav-label,.nav-footer{display:none}.pagehead{display:block}.actions{margin-top:15px}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span-two{grid-column:auto}.demo-notice{padding:10px 20px}.demo-notice span{display:block}}
  </style>
</head>
<body>
  <div class="demo-notice" data-shh-ignore><strong>STRIKE HER HEART · 交互演示</strong><span>虚构业务系统与数据。点击原页面旁的编号，在右侧查看、编辑说明；页面按钮仍可操作。</span> <a href="./workflow.html" style="display:inline-block;margin-top:4px;font-weight:600">查看 agent 工作流 ↗</a></div>
  <header class="topbar"><div class="brand"><span class="brand-mark">n</span> northstar <span class="workspace">／　演示工作空间</span></div><div class="top-right"><span class="mini">协作管理平台</span><span class="avatar" aria-label="演示用户 林澈">林</span></div></header>
  <div class="layout"><nav class="nav" aria-label="主导航"><div class="nav-label">Workspace</div><a id="nav-leads" href="#/leads">◈　客户线索</a><a id="nav-projects" href="#/projects">▦　协作项目</a><a id="nav-settings" href="#/settings">⚙　工作空间设置</a><div class="nav-footer">所有数据仅供演示<br>不会发送到业务服务器</div></nav><main id="main" class="main"></main></div>
  <dialog id="lead-dialog" aria-labelledby="dialog-title"><form id="new-lead-form"><div class="dialog-head"><h2 id="dialog-title">新增客户线索</h2><button type="button" id="close-dialog" class="close" aria-label="关闭新增客户线索">×</button></div><div class="dialog-body"><div class="field"><label for="lead-name">客户名称 <span class="required">*</span></label><input id="lead-name" class="input" required maxlength="40" placeholder="请输入客户名称，最多 40 字"><small>必填，最多 40 个字符。</small></div><div class="field"><label for="lead-contact">联系人邮箱</label><input id="lead-contact" class="input" type="email" placeholder="name@example.com"><small>选填，填写后需要符合邮箱格式。</small></div><div class="field"><label for="lead-source">线索来源</label><select id="lead-source" class="input"><option value="website">官网咨询</option><option value="event">活动报名</option><option value="referral">客户推荐</option></select></div><div class="field"><label for="lead-note">备注</label><textarea id="lead-note" class="input" maxlength="200" placeholder="补充跟进背景，最多 200 字"></textarea></div></div><div class="dialog-foot"><button type="button" id="cancel-dialog" class="button">取消</button><button type="submit" id="save-lead" class="button primary">保存线索</button></div></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    (() => {
      'use strict';
      const main = document.getElementById('main');
      const leads = [{name:'青岚设计工作室',id:'NS-1028',contact:'陈未',stage:'待跟进',tone:'amber',owner:'林澈',date:'2026-10-22'},{name:'星野科技',id:'NS-1027',contact:'许知',stage:'沟通中',tone:'',owner:'周宁',date:'2026-10-21'},{name:'远山文化',id:'NS-1026',contact:'沈文',stage:'已转化',tone:'gray',owner:'林澈',date:'2026-10-20'}];
      let filterText = '', filterStage = '', selectedTab = 'all', toastTimer;
      const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      function toast(message) { const el=document.getElementById('toast'); el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3000); }
      function rows() { const visible=leads.filter(item => item.name.includes(filterText)&&(!filterStage||item.stage===filterStage)&&(selectedTab==='all'||item.owner==='林澈'));return visible.length?visible.map((item,index)=>`<tr data-row-key="${esc(item.id)}"><td><input type="checkbox" aria-label="选择客户 ${esc(item.name)}"></td><td><span class="name">${esc(item.name)}</span><br><span class="mini">${esc(item.id)}</span></td><td>${esc(item.contact)}</td><td><span class="status ${item.tone}">${esc(item.stage)}</span></td><td>${esc(item.owner)}</td><td>${esc(item.date)}</td><td><a href="#/projects" aria-label="查看 ${esc(item.name)} 的项目">查看项目 ↗</a></td></tr>`).join(''):`<tr><td colspan="7" class="empty">没有符合条件的线索。请调整查询条件。</td></tr>`; }
      function renderLeads() { main.innerHTML=`<div class="eyebrow">RELATIONSHIPS</div><div class="pagehead"><div><h1>客户线索</h1><p class="sub">从第一次对话，开始下一次合作。</p></div><div class="actions"><button id="export-leads" class="button">导出演示数据</button><button id="new-lead" class="button primary">＋ 新增线索</button></div></div><section class="stats" aria-label="线索概览"><div class="stat"><div class="stat-label">本月新增线索</div><div class="stat-value">24</div><div class="stat-foot">较上月 + 12.5%</div></div><div class="stat"><div class="stat-label">正在跟进</div><div class="stat-value">16</div><div class="stat-foot">有 4 位客户等待首次联系</div></div><div class="stat"><div class="stat-label">本月转化率</div><div class="stat-value">32<span style="font-size:16px">%</span></div><div class="stat-foot">保持温度，推进每一次合作</div></div></section><section class="panel"><div class="tabs" role="tablist" aria-label="线索视图"><button id="tab-all" role="tab" aria-selected="${selectedTab==='all'}">全部线索</button><button id="tab-mine" role="tab" aria-selected="${selectedTab==='mine'}">我负责的</button></div><form id="filter-form" class="filters"><div class="field grow"><label for="search-name">客户名称</label><input id="search-name" class="input" type="search" value="${esc(filterText)}" placeholder="搜索客户名称" maxlength="40"></div><div class="field"><label for="filter-stage">跟进状态</label><select id="filter-stage" class="input"><option value="">全部状态</option>${['待跟进','沟通中','已转化'].map(value=>`<option ${filterStage===value?'selected':''}>${value}</option>`).join('')}</select></div><div class="field"><label for="created-after">创建日期起</label><input id="created-after" class="input" type="date" max="2026-10-23" aria-describedby="date-hint"></div><button id="query-leads" type="submit" class="button primary">查询</button><button id="reset-filter" type="button" class="button">重置</button></form><p id="date-hint" class="note" style="margin:0 20px 14px">演示中名称和状态参与筛选；日期控件仅演示输入与日期上限。</p><div class="table-wrap"><table><thead><tr><th><input id="select-all" type="checkbox" aria-label="选择当前列表的全部客户"></th><th>客户名称</th><th>联系人</th><th>跟进状态</th><th>负责人</th><th>创建日期</th><th>操作</th></tr></thead><tbody id="lead-rows">${rows()}</tbody></table></div><div class="table-foot"><span id="lead-count">本地演示列表 · ${leads.length} 条线索</span><div class="actions"><button id="previous-page" class="button" disabled aria-label="上一页">‹</button><span>1 / 1</span><button id="next-page" class="button" disabled aria-label="下一页">›</button></div></div></section><div class="helper">提示：可以点击“新增线索”查看弹窗内的标注，也可以切换左侧页面查看各页面的独立编号。</div>`;
        document.getElementById('new-lead').onclick=()=>document.getElementById('lead-dialog').showModal();
        document.getElementById('export-leads').onclick=()=>toast('演示：已模拟导出操作，未生成业务文件。');
        document.getElementById('filter-form').onsubmit=event=>{event.preventDefault();filterText=document.getElementById('search-name').value.trim();filterStage=document.getElementById('filter-stage').value;document.getElementById('lead-rows').innerHTML=rows();};
        document.getElementById('reset-filter').onclick=()=>{filterText='';filterStage='';renderLeads();};
        document.getElementById('tab-all').onclick=()=>{selectedTab='all';renderLeads();};document.getElementById('tab-mine').onclick=()=>{selectedTab='mine';renderLeads();};
        document.getElementById('select-all').onchange=event=>main.querySelectorAll('tbody input[type=checkbox]').forEach(input=>input.checked=event.target.checked);
      }
      function renderProjects(){main.innerHTML=`<div class="eyebrow">PROJECTS</div><div class="pagehead"><div><h1>协作项目</h1><p class="sub">把共同的方向，变成每一天的进展。</p></div><a id="return-leads" class="help-link" href="#/leads">返回客户线索 ↗</a></div><div class="project-select"><label for="project-owner">项目负责人</label><select id="project-owner" class="input"><option>全部成员</option><option>林澈</option><option>周宁</option></select><button id="refresh-projects" class="button">刷新列表</button></div><div class="grid-two"><section class="panel project-card"><div class="project-title">品牌焕新计划 <span class="status">进行中</span></div><p class="project-meta">青岚设计工作室 · 负责人 林澈</p><div class="progress-track" role="progressbar" aria-label="品牌焕新计划进度" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill"></div></div><div class="project-bottom"><span>已完成 17 / 25 项</span><span>2026.11.15 截止</span></div><div class="outline">当前阶段：视觉方向确认<br>下一步：收集演示反馈，确认最终方案。</div><button id="view-project" class="text-button" style="margin-top:18px">查看演示详情 →</button><p id="project-detail" class="note" hidden>这是静态演示项目。真实系统中的目标页面需要实际访问后再标注。</p></section><section class="panel project-card"><div class="project-title">官网体验升级 <span class="status amber">待启动</span></div><p class="project-meta">星野科技 · 负责人 周宁</p><div class="progress-track"><div class="progress-fill" style="width:8%"></div></div><div class="project-bottom"><span>已完成 2 / 25 项</span><span>2026.12.01 截止</span></div><div class="outline">启动条件：需求范围确认完成。<br>下一步：安排演示启动会议。</div><button id="start-project" class="text-button" disabled>等待项目启动</button></section></div><div class="helper">页面级说明和控件级说明会一起保留在本页。返回其他页面后，可继续查看对应标注。</div>`;document.getElementById('refresh-projects').onclick=()=>toast('项目演示列表已刷新。');document.getElementById('project-owner').onchange=()=>toast('演示选择已变更；项目列表为固定样例。');document.getElementById('view-project').onclick=()=>{const el=document.getElementById('project-detail');el.hidden=!el.hidden;};}
      function renderSettings(){main.innerHTML=`<div class="eyebrow">PREFERENCES</div><div class="pagehead"><div><h1>工作空间设置</h1><p class="sub">让协作方式，适合你的团队。</p></div><span class="status">仅演示 · 本地修改</span></div><form id="settings-form" class="panel"><div class="panel-head"><h2>基本信息与通知</h2><span class="mini">带 * 的项目为必填</span></div><div class="form-grid"><div class="field"><label for="workspace-name">工作空间名称 *</label><input id="workspace-name" class="input" value="northstar 演示工作空间" maxlength="30" required><small>最多 30 个字符。</small></div><div class="field"><label for="workspace-zone">时区</label><select id="workspace-zone" class="input"><option value="Asia/Shanghai">北京时间 UTC+8</option><option value="UTC">协调世界时 UTC</option></select></div><div class="field"><label for="notification-email">通知邮箱</label><input id="notification-email" class="input" type="email" placeholder="team@example.com"><small>选填，需为有效邮箱地址。</small></div><div class="field"><label for="daily-time">摘要发送时间</label><input id="daily-time" class="input" type="time" value="09:00"></div><div class="field span-two"><label for="workspace-desc">空间说明</label><textarea id="workspace-desc" class="input" maxlength="200" placeholder="向协作成员介绍这个工作空间">用于展示原页面标注交互的虚构工作空间。</textarea><small>最多 200 个字符。</small></div><label class="check span-two"><input id="enable-digest" type="checkbox" checked>接收每日协作摘要（演示开关，不会发送邮件）</label><div class="span-two"><span class="field-label">默认项目视图</span><div class="actions" style="margin-top:10px"><label class="check"><input id="view-list" name="default-view" type="radio" value="list" checked>列表视图</label><label class="check"><input id="view-board" name="default-view" type="radio" value="board">看板视图</label></div></div></div><div class="settings-footer"><button type="reset" id="reset-settings" class="button">恢复表单初始值</button><button type="submit" id="save-settings" class="button primary">保存演示设置</button></div></form><div class="helper">保存设置仅显示反馈，不持久化演示业务数据。标注内容由标注工具独立保存。</div>`;document.getElementById('settings-form').onsubmit=event=>{event.preventDefault();toast('演示设置已确认，未写入真实系统。');};}
      function render(){const route=location.hash||'#/leads';document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')===route?'page':'false'));if(route==='#/settings')renderSettings();else if(route==='#/projects')renderProjects();else renderLeads();document.title=`${route==='#/settings'?'工作空间设置':route==='#/projects'?'协作项目':'客户线索'} · Strike Her Heart 演示`;}
      document.getElementById('close-dialog').onclick=()=>document.getElementById('lead-dialog').close();document.getElementById('cancel-dialog').onclick=()=>document.getElementById('lead-dialog').close();
      document.getElementById('new-lead-form').onsubmit=event=>{event.preventDefault();leads.unshift({name:document.getElementById('lead-name').value.trim(),id:`NS-${1029+leads.length-3}`,contact:'演示联系人',stage:'待跟进',tone:'amber',owner:'林澈',date:'2026-10-23'});document.getElementById('lead-dialog').close();event.target.reset();renderLeads();toast('已添加到本次演示列表。刷新后恢复初始数据。');};
      window.addEventListener('hashchange',render);if(!location.hash)history.replaceState(null,'','#/leads');render();
    })();
  </script>
  <script src="./overlay.js?v=1.4.0"></script>
  <script src="./demo-annotations.js?v=1.4.0"></script>
</body>
</html>
