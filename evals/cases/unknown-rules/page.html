<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未知业务规则与按钮名称推断</title><style>body{max-width:900px;margin:40px auto;padding:0 24px;font:16px/1.6 system-ui,sans-serif;color:#183a34;background:#f7faf8}main,dialog,section{background:white;border:1px solid #d9e5de;border-radius:10px;padding:24px;margin:18px 0}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #b9cdc2;border-radius:6px}input{max-width:100%}button{margin:16px 8px 0 0;background:#e6f0e9}button:disabled{opacity:.45}small,.note{color:#60776c}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce5df}dialog{max-width:480px}dialog::backdrop{background:#183a3433}.notice{background:#fff3d7;padding:12px;border:1px solid #e5ce98}</style></head><body><main><h1>申请处理原型</h1><p class="note">虚构交互原型。没有审批接口，按钮只显示本地点击反馈。</p><label for="request-amount">申请金额</label><input id="request-amount" inputmode="decimal" placeholder="填写金额"><p><button id="approve-request" type="button">通过审批</button><button id="reject-request" type="button">驳回申请</button></p><a id="record-link" href="#operation-record">查看操作记录</a><p id="request-feedback" role="status">尚未操作。</p><section id="operation-record"><h2>操作记录</h2><p>静态占位，未接入真实记录。</p></section></main><script>document.getElementById('approve-request').onclick=()=>document.getElementById('request-feedback').textContent='已演示点击通过；未调用审批接口。';document.getElementById('reject-request').onclick=()=>document.getElementById('request-feedback').textContent='已演示点击驳回；未调用审批接口。';</script></body></html>
