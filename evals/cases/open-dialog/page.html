<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已打开弹窗的控件范围</title><style>body{max-width:900px;margin:40px auto;padding:0 24px;font:16px/1.6 system-ui,sans-serif;color:#183a34;background:#f7faf8}main,dialog,section{background:white;border:1px solid #d9e5de;border-radius:10px;padding:24px;margin:18px 0}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #b9cdc2;border-radius:6px}input{max-width:100%}button{margin:16px 8px 0 0;background:#e6f0e9}button:disabled{opacity:.45}small,.note{color:#60776c}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce5df}dialog{max-width:480px}dialog::backdrop{background:#183a3433}.notice{background:#fff3d7;padding:12px;border:1px solid #e5ce98}</style></head><body><main inert><h1>团队成员</h1><p>当前查看“邀请成员”弹窗。背景内容不属于本次控件范围。</p></main><dialog id="invite-dialog" aria-labelledby="invite-title"><h2 id="invite-title">邀请成员</h2><form id="invite-form"><label for="invite-email">成员邮箱</label><input id="invite-email" type="email" required placeholder="name@example.com"><label for="invite-role">成员角色</label><select id="invite-role"><option value="viewer">查看者</option><option value="editor">编辑者</option></select><p><button id="send-invite" type="submit">发送邀请</button><button id="cancel-invite" type="button">取消</button></p></form><p id="invite-status" role="status">本地演示，不会发出邮件。</p></dialog><script>const dialog=document.getElementById('invite-dialog');dialog.showModal();document.getElementById('invite-form').onsubmit=event=>{event.preventDefault();document.getElementById('invite-status').textContent='演示：已显示邀请反馈，没有发送邮件。';};document.getElementById('cancel-invite').onclick=()=>dialog.close();</script></body></html>
