<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRD 与页面约束发生冲突</title><style>body{max-width:900px;margin:40px auto;padding:0 24px;font:16px/1.6 system-ui,sans-serif;color:#183a34;background:#f7faf8}main,dialog,section{background:white;border:1px solid #d9e5de;border-radius:10px;padding:24px;margin:18px 0}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #b9cdc2;border-radius:6px}input{max-width:100%}button{margin:16px 8px 0 0;background:#e6f0e9}button:disabled{opacity:.45}small,.note{color:#60776c}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce5df}dialog{max-width:480px}dialog::backdrop{background:#183a3433}.notice{background:#fff3d7;padding:12px;border:1px solid #e5ce98}</style></head><body><main><h1>编辑任务草稿</h1><p class="note">页面版本：2026-10-27；需求说明版本见 PRD。</p><form id="task-form"><label for="task-title">任务标题</label><input id="task-title" maxlength="30" placeholder="最多 30 个字符"><small>当前页面最多 30 个字符。</small><label for="review-quota">复核人数</label><input id="review-quota" type="number" min="1" max="10" value="2"><small>当前页面范围：1 到 10。</small><label><input id="remind-owner" type="checkbox" checked>提醒负责人</label><button id="save-task" type="submit">保存草稿</button></form><p id="task-status" role="status">未提交。</p></main><script>document.getElementById('task-form').addEventListener('submit',event=>{event.preventDefault();document.getElementById('task-status').textContent='演示：仅显示草稿保存反馈。';});</script></body></html>
