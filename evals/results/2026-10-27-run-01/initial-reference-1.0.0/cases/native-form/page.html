<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原生输入约束与 PRD 独有权限</title><style>body{max-width:900px;margin:40px auto;padding:0 24px;font:16px/1.6 system-ui,sans-serif;color:#183a34;background:#f7faf8}main,dialog,section{background:white;border:1px solid #d9e5de;border-radius:10px;padding:24px;margin:18px 0}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #b9cdc2;border-radius:6px}input{max-width:100%}button{margin:16px 8px 0 0;background:#e6f0e9}button:disabled{opacity:.45}small,.note{color:#60776c}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce5df}dialog{max-width:480px}dialog::backdrop{background:#183a3433}.notice{background:#fff3d7;padding:12px;border:1px solid #e5ce98}</style></head><body><main><h1>创建项目草稿</h1><p class="note">虚构本地原型。只显示保存反馈，不写入业务服务器。</p><form id="draft-form"><label for="customer-name">客户名称</label><input id="customer-name" name="customer" required maxlength="24" placeholder="请输入客户名称"><small>必填，最多 24 个字符。</small><label for="seat-count">成员席位</label><input id="seat-count" name="seats" type="number" min="1" max="50" value="1"><small>1 到 50；不填写时可留空。</small><label for="plan-select">方案</label><select id="plan-select" name="plan"><option value="basic">基础版</option><option value="pro">专业版</option></select><p><button id="save-draft" type="submit">保存草稿</button></p></form><p id="save-status" role="status">尚未保存。</p></main><script>document.getElementById('draft-form').addEventListener('submit',event=>{event.preventDefault();document.getElementById('save-status').textContent='演示：已显示草稿保存反馈，未写入业务服务器。';});</script></body></html>
