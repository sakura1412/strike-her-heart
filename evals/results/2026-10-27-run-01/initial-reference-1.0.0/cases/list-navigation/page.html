<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>即时筛选、页内跳转与禁用按钮</title><style>body{max-width:900px;margin:40px auto;padding:0 24px;font:16px/1.6 system-ui,sans-serif;color:#183a34;background:#f7faf8}main,dialog,section{background:white;border:1px solid #d9e5de;border-radius:10px;padding:24px;margin:18px 0}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #b9cdc2;border-radius:6px}input{max-width:100%}button{margin:16px 8px 0 0;background:#e6f0e9}button:disabled{opacity:.45}small,.note{color:#60776c}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce5df}dialog{max-width:480px}dialog::backdrop{background:#183a3433}.notice{background:#fff3d7;padding:12px;border:1px solid #e5ce98}</style></head><body><main><h1>协作项目</h1><label for="project-query">项目名称</label><input id="project-query" type="search" placeholder="按项目名称筛选"><label for="project-stage">项目状态</label><select id="project-stage"><option value="all">全部</option><option value="active">进行中</option><option value="done">已完成</option></select><table><thead><tr><th>项目</th><th>状态</th></tr></thead><tbody><tr data-name="青禾改版" data-stage="active"><td>青禾改版</td><td>进行中</td></tr><tr data-name="山岚归档" data-stage="done"><td>山岚归档</td><td>已完成</td></tr></tbody></table><p><a id="project-link" href="#project-overview">查看项目说明</a></p><button id="export-disabled" disabled>导出项目</button><p class="note">导出尚未接入，按钮固定禁用。</p><section id="project-overview"><h2>项目说明</h2><p>此处为当前页面内的项目说明区。</p></section></main><script>function filterRows(){const q=document.getElementById('project-query').value;const s=document.getElementById('project-stage').value;document.querySelectorAll('tbody tr').forEach(row=>row.hidden=!row.dataset.name.includes(q)||(s!=='all'&&row.dataset.stage!==s));}document.getElementById('project-query').addEventListener('input',filterRows);document.getElementById('project-stage').addEventListener('change',filterRows);</script></body></html>
